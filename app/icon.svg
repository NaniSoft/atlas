<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Atlas's own mark: the twin.

    The graph it replaced, three nodes and the edges among them with the
    emphasised node the twin, shared its whole silhouette with Nexus's loop:
    two products, two triangles of nodes, one accent on top, and no way to tell
    the tabs apart. The claim the name makes is the twin, so the mark is that:
    the estate on the left in ink, its living model on the right in mint, one
    the mirror of the other across the peak where they agree. Two strokes at
    the family angle and one node, legible at 16px. No colour here that is not
    a value out of the mint pack's dark block (`#161917` ground, `#9ddcad`
    primary, `#ebeeeb` ink). A favicon is an image rather than a surface, so
    these are values and not tokens.
  -->
  <rect width="32" height="32" rx="4" fill="#161917" />
  <path d="M4 21.5 L16 16" fill="none" stroke="#ebeeeb" stroke-width="2.5" stroke-linecap="round" />
  <path d="M16 16 L28 21.5" fill="none" stroke="#9ddcad" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="16" cy="16" r="2.4" fill="#9ddcad" />
</svg>
