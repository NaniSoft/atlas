# Throwaway, and gone the moment it has done its one job: regenerate the
# visual suite's snapshots on the platform CI runs, so the goldens stop being
# a Windows-only artefact of a suite that also runs on ubuntu. The suite's
# mobile and tablet projects run WebKit, so WebKit installs beside Chromium.
# The updated snapshots are committed straight back to the dispatching branch.
name: visual-update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test --update-snapshots
      - name: Commit the regenerated snapshots
        run: |
          git config user.name "durgaprasad.vennapusa"
          git config user.email "durgaprasad.vennapusa@gmail.com"
          git add test/visual
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "The goldens render on the platform CI runs: linux snapshots for 1.10.0"
            git push origin HEAD
          fi
